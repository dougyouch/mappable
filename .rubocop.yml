AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'vendor/**/*'
    - 'coverage/**/*'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Style/Documentation:
  Enabled: false

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Layout/LineLength:
  Max: 130
  Exclude:
    - 'spec/**/*'

# File naming - allow hyphenated gem name
Naming/FileName:
  Exclude:
    - 'lib/model-mapper.rb'

# Mappings are compiled into methods with class_eval; the generated source is
# documented by Mappable::Compiler
Style/DocumentDynamicEvalDefinition:
  Enabled: false
